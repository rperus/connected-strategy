steps:
  # 1. Build the multi-stage Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/connected-strategy:$COMMIT_SHA', '.']

  # 2. Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/connected-strategy:$COMMIT_SHA']

  # 3. Deploy the image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'connected-strategy-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/connected-strategy:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--port'
      - '4311' # The backend API port exposed by the docker container
      - '--set-env-vars'
      - 'NODE_ENV=production,PORT=4311'
      # To add Secrets: 
      # - '--set-secrets'
      # - 'GEMINI_API_KEY=GEMINI_API_KEY:latest'

images:
  - 'gcr.io/$PROJECT_ID/connected-strategy:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
