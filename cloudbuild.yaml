steps:
  # 1. Build the multi-stage Docker image (targetting the server stage)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--target', 'server', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/connected-strategy/api:latest', '.']

  # 2. Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/connected-strategy/api:latest']

  # 3. Deploy the image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'connected-strategy-api'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/connected-strategy/api:latest'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--port'
      - '4311' # The backend API port exposed by the docker container
      - '--set-env-vars'
      - 'NODE_ENV=production'
      # W0-6: Inject GEMINI_API_KEY from GCP Secret Manager (not as env var in plaintext)
      # Prerequisite: create secret with: gcloud secrets create GEMINI_API_KEY --data-file=-
      - '--set-secrets'
      - 'GEMINI_API_KEY=GEMINI_API_KEY:latest'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/connected-strategy/api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
